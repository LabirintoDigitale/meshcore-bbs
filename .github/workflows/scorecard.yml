name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 00:00 UTC.
    - cron: "0 0 * * 1"
  push:
    branches: [main]

# Minimal top-level permissions; the analysis job escalates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip on non-canonical repos (e.g. the private dev mirror); the public
    # badge and OIDC publish only make sense on the canonical public repo.
    if: github.repository == 'LabirintoDigitale/meshcore-bbs'
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token used by publish_results.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API so the README badge resolves.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
